<head>

<title>Interaktivní protokol DSSP</title>

<style>
body{
    font-family: Arial, sans-serif;
    max-width:1000px;
    margin:auto;
    padding:20px;
}
h1{text-align:center;}
label{
    display:block;
    margin-top:12px;
    font-weight:bold;
}
input, select, textarea{
    width:100%;
    padding:8px;
    margin-top:4px;
    box-sizing:border-box;
}
textarea{min-height:70px;}
button{

    padding:10px 20px;

}
.box{

    form, button, h1{display:none;}
    #vystup{
        border:none;
        margin:0;
        padding:0;

<h1>Interaktivní protokol DSSP</h1>

<label>Datum narození</label> <input type="date" id="narozeni">

<label>Adresa</label> <input type="text" id="adresa">

<label>Identifikovaná ohrožená skupina</label> <select id="skupina" onchange="zobrazPoradenstvi()"> <option value="">-- Vyberte skupinu --</option> <option value="exekuce">Klienti s exekucemi a dluhovou zátěží</option> <option value="vyzivne">Domácnosti s nehrazeným výživným</option> <option value="ubytovna">Více osob na pokoji v ubytovně/pobytové sociální službě</option> <option value="prijem">Osoby, které přišly o zaměstnání nebo jiný pravidelný příjem</option> </select>

<div id="oblasti" class="box" style="display:none;"></div>

<button type="button" onclick="generuj()">Vygenerovat protokol</button> <button type="button" onclick="window.print()">Tisk / uložit jako PDF</button> <button type="button" onclick="location.reload()">Vymazat formulář</button>

function zobrazPoradenstvi(){
    var skupina = document.getElementById("skupina").value;
    var box = document.getElementById("oblasti");
    box.innerHTML = "";

    if(skupina === ""){
        box.style.display = "none";
        return;
    }

    box.style.display = "block";
    box.innerHTML = "<h2>Oblast poradenství</h2>";

    var oblasti = data[skupina].oblasti;

    for(var i = 0; i < oblasti.length; i++){
        var o = oblasti[i];

        box.innerHTML +=
            '<div class="poradenstvi">' +
            '<label><input type="checkbox" id="' + o.id + '" style="width:auto;"> ' + o.nazev + ': ANO/NE</label>' +
            '<label>Poznámka k této oblasti</label>' +

function generuj(){
var datum = document.getElementById("datum").value;
var misto = document.getElementById("misto").value;
var jmeno = document.getElementById("jmeno").value;
var narozeni = document.getElementById("narozeni").value;
var adresa = document.getElementById("adresa").value;

```
var skupinaSelect = document.getElementById("skupina");
var skupinaKey = skupinaSelect.value;
var skupinaText = skupinaSelect.options[skupinaSelect.selectedIndex].text;

var textPoradenstvi = "";

if(skupinaKey !== ""){
    textPoradenstvi += "\n\n" + data[skupinaKey].uvod + "\n";

    var oblasti = data[skupinaKey].oblasti;

    for(var i = 0; i < oblasti.length; i++){
        var o = oblasti[i];
        var checkbox = document.getElementById(o.id);
        var poznamka = document.getElementById(o.id + "_poznamka").value;

        if(checkbox && checkbox.checked){
            textPoradenstvi += "\n\n" + o.nazev + ":\n" + o.text + "\n";

            if(poznamka.trim() !== ""){
                textPoradenstvi += "\nPoznámka pracovníka:\n" + poznamka + "\n";
            }
        }
    }
}
