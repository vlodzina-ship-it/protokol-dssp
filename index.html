function zobrazPoradenstvi(){
    const skupina = document.getElementById("skupina").value;
    const box = document.getElementById("oblasti");
    box.innerHTML = "";

    if(!skupina){
        box.style.display = "none";
        return;
    }

    box.style.display = "block";
    box.innerHTML += "<h2>Oblast poradenství</h2>";

    data[skupina].oblasti.forEach(o => {
        box.innerHTML += `
            <div class="poradenstvi">
                <label>
                    <input type="checkbox" id="${o.id}" style="width:auto;">
                    ${o.nazev}: ANO/NE
                </label>
                <label>Poznámka k této oblasti</label>
                <textarea id="${o.id}_poznamka" placeholder="Volitelná poznámka pracovníka..."></textarea>

```
        </div>
    `;
});
```

}

function generuj(){

```
const datum = document.getElementById("datum").value;
const misto = document.getElementById("misto").value;
const jmeno = document.getElementById("jmeno").value;
const narozeni = document.getElementById("narozeni").value;
const adresa = document.getElementById("adresa").value;

const skupinaSelect = document.getElementById("skupina");
const skupinaKey = skupinaSelect.value;
const skupinaText = skupinaSelect.options[skupinaSelect.selectedIndex].text;

let textPoradenstvi = "";

if(skupinaKey){
    textPoradenstvi += "\n\n" + data[skupinaKey].uvod + "\n";

    data[skupinaKey].oblasti.forEach(o => {
        const checked = document.getElementById(o.id)?.checked;
        const poznamka = document.getElementById(o.id + "_poznamka")?.value;

        if(checked){
            textPoradenstvi += `\n\n${o.nazev}:\n${o.text}\n`;

            if(poznamka.trim() !== ""){
                textPoradenstvi += `\nPoznámka pracovníka:\n${poznamka}\n`;
            }
        }
    });
}

document.getElementById("vystup").innerText = `
