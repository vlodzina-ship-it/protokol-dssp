<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Interaktivní protokol DSSP</title>
<style>
body{font-family:Arial,sans-serif;max-width:1000px;margin:auto;padding:20px}
h1{text-align:center}
label{display:block;margin-top:12px;font-weight:bold}
input,select,textarea{width:100%;padding:8px;box-sizing:border-box}
textarea{height:70px}
button{margin-top:15px;padding:10px 18px}
.box{border:1px solid #ccc;background:#f9f9f9;padding:15px;margin-top:15px}
.item{border:1px solid #ddd;background:white;padding:10px;margin-top:10px}
#vystup{border:1px solid #ccc;margin-top:25px;padding:20px;white-space:pre-wrap;min-height:200px}
@media print{form,h1{display:none}#vystup{border:none}}
</style>
</head>
<body>

<h1>Interaktivní protokol DSSP</h1>

<form>
<label>Datum jednání</label>
<input type="date" id="datum">

<label>Místo jednání</label>
<input type="text" id="misto" value="v Osoblaze">

<label>Jméno a příjmení klienta</label>
<input type="text" id="jmeno">

<label>Datum narození</label>
<input type="date" id="narozeni">

<label>Adresa</label>
<input type="text" id="adresa">

<label>Identifikovaná ohrožená skupina</label>
<select id="skupina" onchange="zobrazPoradenstvi()">
<option value="">-- Vyberte skupinu --</option>
<option value="exekuce">Klienti s exekucemi a dluhovou zátěží</option>
<option value="vyzivne">Domácnosti s nehrazeným výživným</option>
<option value="ubytovna">Více osob na pokoji v ubytovně/pobytové sociální službě</option>
<option value="prijem">Osoby, které přišly o zaměstnání nebo jiný pravidelný příjem</option>
</select>

<div id="oblasti" class="box" style="display:none"></div>

<button type="button" onclick="generuj()">Vygenerovat protokol</button>
<button type="button" onclick="window.print()">Tisk / uložit jako PDF</button>
<button type="button" onclick="location.reload()">Vymazat formulář</button>
</form>

<div id="vystup"></div>

<script>
var data = {
  exekuce: {
    uvod: "Dluhová situace bývá dlouhodobě velmi zatěžující, ale je důležité začít ji řešit co nejdříve. Můžeme s Vámi projít možnosti odborného poradenství, podpory při hledání zaměstnání i další kroky, které mohou pomoci postupně stabilizovat Vaši finanční situaci.",
    oblasti: [
      ["pracovni_motivace","Pracovní aktivita a motivace","Klientovi bylo vysvětleno, že legální pracovní aktivita může i přes probíhající exekuce nebo insolvenci přispět ke zlepšení jeho finanční a sociální situace. Bylo s ním projednáno, že pravidelný příjem ze zaměstnání může přinést větší finanční stabilitu, pracovní zkušenosti a vytvořit podmínky pro postupné řešení dluhové situace."],
      ["dluhove","Dluhové poradenství","Klientovi bylo doporučeno využití odborného dluhového poradenství za účelem lepší orientace v jeho dluhové situaci a nalezení vhodných možností jejího řešení. Byly s ním projednány možnosti komunikace s věřiteli, řešení exekučních řízení, případného oddlužení a další postupy vedoucí ke stabilizaci finanční situace."],
      ["socialni_exekuce","Sociální práce a návazná pomoc","Klientovi byla doporučena spolupráce se sociálním pracovníkem obce nebo nestátní neziskovou organizací, kteří mohou pomoci s orientací v systému sociální pomoci, řešením nepříznivé sociální situace a zprostředkováním návazných služeb."]
    ]
  },
  vyzivne: {
    uvod: "Klientovi bylo vysvětleno, že je důležité řešit otázku výživného oficiální cestou, aby bylo možné správně posoudit sociální situaci domácnosti a využít dostupné formy podpory.",
    oblasti: [
      ["reseni_vyzivneho","Řešení výživného","Klientovi bylo vysvětleno, že řádně stanovené a vymahatelné výživné je důležité nejen pro zabezpečení potřeb dítěte, ale také pro správné posouzení nároku na dávkovou podporu."],
      ["nahradni_vyzivne","Náhradní výživné","Klientovi byla doporučena možnost podání žádosti o náhradní výživné v případech, kdy druhý rodič výživné nehradí vůbec nebo jej hradí pouze částečně."],
      ["ohrozeni_bydleni","Podpora při ohrožení bydlení","S klientem byla projednána jeho aktuální finanční a bytová situace. V odůvodněných případech byla s klientem projednána možnost poskytnutí mimořádné okamžité pomoci."],
      ["socialni_vyzivne","Sociální práce a návazná pomoc","Klientovi byla doporučena spolupráce se sociálním pracovníkem obce nebo nestátní neziskovou organizací, kteří mohou poskytnout podporu při orientaci v systému sociální pomoci."]
    ]
  },
  ubytovna: {
    uvod: "Současná forma bydlení může ovlivňovat výši podpory i celkovou stabilitu situace klienta. Je proto vhodné začít včas řešit možnosti vhodnějšího a dlouhodobějšího bydlení.",
    oblasti: [
      ["vhodnejsi_bydleni","Hledání vhodnějšího bydlení","S klientem byla projednána možnost zajištění stabilnějšího a standardního bydlení, zejména v případech, kdy aktuálně využívá ubytovací zařízení nebo pobytové sociální služby."],
      ["pracovni_aktivita","Pracovní aktivita","Klientovi bylo vysvětleno, že pracovní aktivita a legální, doložitelné příjmy mohou přispět ke zlepšení jeho finanční a sociální situace."],
      ["socialni_ubytovna","Sociální práce a návazná pomoc","Klientovi byla doporučena spolupráce se sociálními pracovníky obce za účelem řešení jeho nepříznivé sociální situace."]
    ]
  },
  prijem: {
    uvod: "Výše DSSP byla stanovena podle příjmů v době podání žádosti. Pokud se situace klienta mezitím změnila a došlo ke ztrátě příjmu, nemusí se tato změna zatím ve výši dávky projevit.",
    oblasti: [
      ["zmena_prijmu","Změna příjmové situace po podání žádosti","Klientovi bylo srozumitelně vysvětleno, že výše dávky státní sociální podpory byla stanovena na základě příjmů z rozhodného období před podáním žádosti a že současná změna nebo ztráta příjmu se dosud nemusela promítnout do výše přiznané dávky."]
    ]
  }
};

function zobrazPoradenstvi(){
  var key = document.getElementById("skupina").value;
  var box = document.getElementById("oblasti");
  box.innerHTML = "";

  if(key === ""){
    box.style.display = "none";
    return;
  }

  box.style.display = "block";
  box.innerHTML = "<h2>Oblast poradenství</h2>";

  var oblasti = data[key].oblasti;

  for(var i=0;i<oblasti.length;i++){
    var id = oblasti[i][0];
    var nazev = oblasti[i][1];

    box.innerHTML +=
      "<div class='item'>" +
      "<label><input type='checkbox' id='" + id + "' style='width:auto'> " + nazev + ": ANO/NE</label>" +
      "<label>Poznámka</label>" +
      "<textarea id='" + id + "_poznamka'></textarea>" +
      "</div>";
  }
}

function generuj(){
  var datum = document.getElementById("datum").value;
  var misto = document.getElementById("misto").value;
  var jmeno = document.getElementById("jmeno").value;
  var narozeni = document.getElementById("narozeni").value;
  var adresa = document.getElementById("adresa").value;

  var select = document.getElementById("skupina");
  var key = select.value;
  var skupinaText = select.options[select.selectedIndex].text;

  var poradenstvi = "";

  if(key !== ""){
    poradenstvi += "\n" + data[key].uvod + "\n";

    var oblasti = data[key].oblasti;

    for(var i=0;i<oblasti.length;i++){
      var id = oblasti[i][0];
      var nazev = oblasti[i][1];
      var text = oblasti[i][2];

      var checkbox = document.getElementById(id);
      var poznamka = document.getElementById(id + "_poznamka").value;

      if(checkbox.checked){
        poradenstvi += "\n" + nazev + ":\n" + text + "\n";

        if(poznamka.trim() !== ""){
          poradenstvi += "\nPoznámka pracovníka:\n" + poznamka + "\n";
        }
      }
    }
  }

  document.getElementById("vystup").innerText =
"Úřad práce ČR – Kontaktní pracoviště Krnov\n\n" +
"Datum jednání: " + datum + "\n" +
"Místo jednání: " + misto + "\n\n" +
"P R O T O K O L\n\n" +
"ve smyslu ustanovení § 18 zákona č. 500/2004 Sb., správní řád, ve znění pozdějších předpisů\n\n" +
"Účastník řízení:\n\n" +
"Jméno a příjmení: " + jmeno + "\n" +
"Datum narození: " + narozeni + "\n" +
"Místo trvalého pobytu: " + adresa + "\n\n" +
"Předmět jednání:\n" +
"Možnosti řešení nízké dávky DSSP\n\n" +
"Jmenovaný/á byl/a seznámen/a s rozhodnutím o DSSP, které mu/jí bylo srozumitelně vysvětleno.\n\n" +
"Identifikovaná ohrožená skupina:\n" +
skupinaText + "\n\n" +
poradenstvi + "\n\n" +
"Účastník řízení dle svého vyjádření všemu porozuměl.\n" +
"Účastník řízení si protokol přečetl a s jeho obsahem souhlasí.\n\n" +
"Jednání bylo ukončeno v ______ hodin.\n\n\n" +
"............................................\n" +
"oprávněná úřední osoba\n\n\n" +
"............................................\n" +
"účastník řízení";
}
</script>

</body>
</html>
:::

Po uložení dej **Commit changes** a na webu **Ctrl + F5**.
