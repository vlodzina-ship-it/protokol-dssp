<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktivní protokol DSSP</title>

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <link rel="stylesheet" href="style.css?v=1.6">
    <link rel="manifest" href="manifest.json?v=1.6">
    <meta name="theme-color" content="#0F0888">
    <link rel="icon" href="logo-upcr.png?v=1.6">
</head>

<body>

<div class="app">

    <h1>Interaktivní protokol DSSP</h1>

    <form id="formular">

        <label>Pořadové číslo jednací</label>
        <input type="text" id="cj" placeholder="např. 12345">

        <label>Datum jednání</label>
        <input type="date" id="datum">

        <label>Pracoviště</label>
        <select id="pracoviste" onchange="aktualizujPracovniky()">
            <option value="Osoblaha">Osoblaha</option>
            <option value="Město Albrechtice">Město Albrechtice</option>
            <option value="Krnov">Krnov</option>
        </select>

        <label>Oddělení</label>
        <select id="oddeleni" onchange="aktualizujPracovniky()">
            <option value="NSD I">NSD I</option>
            <option value="NSD II">NSD II</option>
        </select>

        <label>Úřední osoba</label>
        <select id="urednik"></select>

        <label>Funkce</label>
        <input type="text" id="funkce" value="Ověřovatel dávek NSD">

        <label>Jméno a příjmení klienta</label>
        <input type="text" id="jmeno">

        <label>Datum narození</label>
        <input type="date" id="narozeni">

        <label>Adresa</label>
        <input type="text" id="adresa">

        <label>Čas ukončení jednání</label>
        <input type="time" id="casUkonceni">

        <div class="box">

            <h2>Rychlý výběr situace klienta</h2>

            <label>
                <input type="checkbox" onchange="balicek('nezranitelni', this.checked)">
                Nezranitelné osoby bez pracovní aktivity
            </label>

            <label>
                <input type="checkbox" onchange="balicek('zranitelni', this.checked)">
                Ohrožené zranitelné domácnosti
            </label>

            <label>
                <input type="checkbox" onchange="balicek('samozivitele', this.checked)">
                Samoživitelé s nízkými příjmy
            </label>

            <label>
                <input type="checkbox" onchange="balicek('naklady_bydleni', this.checked)">
                Domácnosti s vysokými náklady na bydlení
            </label>

            <label>
                <input type="checkbox" onchange="balicek('ubytovna', this.checked)">
                Více osob na pokoji v ubytovně / pobytové sociální službě
            </label>

            <label>
                <input type="checkbox" onchange="balicek('vyzivne', this.checked)">
                Domácnosti s nehrazeným výživným
            </label>

            <label>
                <input type="checkbox" onchange="balicek('exekuce', this.checked)">
                Klienti s exekucemi a dluhovou zátěží
            </label>

            <label>
                <input type="checkbox" onchange="balicek('prijem', this.checked)">
                Ztráta zaměstnání nebo jiného pravidelného příjmu
            </label>

        </div>

        <div class="box">

            <h2>Oblasti poradenství</h2>

            <button type="button" onclick="vybratVse()">
                Vybrat vše
            </button>

            <button type="button" onclick="zrusitVse()">
                Zrušit vše
            </button>

            <div id="oblastiFormulare"></div>

        </div>

        <button type="button" onclick="generuj()">
            Vygenerovat protokol
        </button>

        <button type="button" onclick="kopirovatProtokol()">
            Kopírovat protokol
        </button>

        <button type="button" onclick="stahnoutWord()">
            Stáhnout Word
        </button>

        <button type="button" onclick="window.print()">
            Uložit PDF
        </button>

        <button type="button" onclick="vymaz()">
            Vymazat formulář
        </button>

    </form>

    <div id="vystup"></div>

    <p class="verze">Interaktivní protokol DSSP – verze 1.6</p>

</div>

<script src="app.js?v=1.6"></script>

<script>
if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
        navigator.serviceWorker.register("./service-worker.js?v=1.7").then(function(registration){
            registration.update();
        });
    });
}
</script>

</body>
</html>
