<!DOCTYPE html>

<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interaktivní protokol DSSP</title>

<style>
body{
    font-family: Arial, sans-serif;
    max-width:1000px;
    margin:auto;
    padding:20px;
}

h1{
    text-align:center;
}

label{
    display:block;
    margin-top:12px;
    font-weight:bold;
}

input, select{
    width:100%;
    padding:8px;
    margin-top:3px;
    box-sizing:border-box;
}

button{
    margin-top:20px;
    padding:10px 20px;
    cursor:pointer;
}

#vystup{
    margin-top:30px;
    border:1px solid #ccc;
    padding:20px;
    min-height:150px;
    white-space:pre-wrap;
}
</style>

</head>

<body>

<h1>Interaktivní protokol DSSP</h1>

<label>Datum jednání</label> <input type="date" id="datum">

<label>Jméno a příjmení klienta</label> <input type="text" id="jmeno">

<label>Datum narození</label> <input type="date" id="narozeni">

<label>Adresa</label> <input type="text" id="adresa">

<label>Identifikovaná ohrožená skupina</label> <select id="skupina"> <option value="">-- Vyberte skupinu --</option>

```
<option>Nezranitelné osoby bez pracovní aktivity</option>
<option>Ohrožené zranitelné domácnosti</option>
<option>Samoživitelé s nízkými příjmy</option>
<option>Domácnosti s vysokými náklady na bydlení</option>
<option>Více osob na pokoji v ubytovně/pobytové sociální službě</option>
<option>Domácnosti s nehrazeným výživným</option>
<option>Klienti s exekucemi a dluhovou zátěží</option>
<option>Osoby, které přišly o zaměstnání nebo jiný pravidelný příjem</option>
```

</select>

<button onclick="generuj()">Vygenerovat protokol</button>

<div id="vystup"></div>

<script>

function generuj(){

let datum = document.getElementById("datum").value;
let jmeno = document.getElementById("jmeno").value;
let narozeni = document.getElementById("narozeni").value;
let adresa = document.getElementById("adresa").value;

let skupinaSelect = document.getElementById("skupina");
let skupina = skupinaSelect.options[skupinaSelect.selectedIndex].text;

document.getElementById("vystup").innerHTML = `

P R O T O K O L

Datum jednání: ${datum}

Účastník řízení:

Jméno a příjmení: ${jmeno}

Datum narození: ${narozeni}

Adresa: ${adresa}

Předmět jednání:
Možnosti řešení nízké dávky DSSP

Identifikovaná ohrožená skupina:

${skupina}

`;

}

</script>

</body>
</html>
